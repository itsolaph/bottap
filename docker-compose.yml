services:
  bottap-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: bottap-gateway
    restart: unless-stopped
    ports:
      - "${BOTTAP_PORT:-8788}:8788"
    env_file:
      - .env
    environment:
      BOTTAP_HOST: "0.0.0.0"
      BOTTAP_PORT: "8788"
      BOTTAP_DATA_DIR: "/data"
      BOTTAP_STATIC_DIR: "/app/app/dist"
    volumes:
      - bottap_data:/data

volumes:
  bottap_data:
